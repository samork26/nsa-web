<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Neuroscience Alliance @ UCF</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="logos/NSA LOGO.PNG" class="logo" alt="NSA Logo">
        <h1>Neuroscience Alliance at UCF</h1>
        <nav>
            <ul class="menu">
                <li class="nav-item"><a href="index.html#" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                <li class="nav-item"><a href="events.html#" class="nav-link">Events</a></li>
                <li class="nav-item"><a href="leadership.html" class="nav-link">Leadership</a></li>
                <li class="nav-item"><a href="faq.html#" class="nav-link">FAQ</a></li>
                <li class="nav-item"><a href="membership.html#" class="nav-link">Membership</a></li>
                <li class="nav-item"><a href="brain-bee.html#" class="nav-link">Brain Bee</a></li>
            </ul> 
        </nav>
    </header>

    <section class="hero">
        <h2>Create Your Account</h2>
    </section>

    <div class="content-wrapper">
        <section class="about">
            <h2>Register</h2>
            <form id="registerForm" class="page-content">
                <div>
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div>
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="year">Year:</label>
                    <input type="text" id="year" name="year">
                </div>
                <div>
                    <label for="major">Major:</label>
                    <input type="text" id="major" name="major">
                </div>
                <div>
                    <button type="submit" class="button">Register</button>
                </div>
            </form>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </section>
    </div>

    <!-- Modal for success message -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="modalMessage">Account creation successful!</p>
            <button id="homeButton" class="button">Go to Home</button>
            <button id="loginButton" class="button" style="display: none;">Go to Login</button>
        </div>
    </div>

    <footer>
        <p>Neuroscience Alliance @ UCF circa. 2023</p>
        <div class="social-links">
            <a href="https://www.instagram.com/neuroallianceucf" target="_blank">
                <img src="logos/instagram-logo.png" alt="Instagram" class="social-icon">
            </a>
            <a href="https://groupme.com/join_group/69826567/X2PI0Tdz" target="_blank">
                <img src="logos/groupme-logo.png" alt="GroupMe" class="social-icon">
            </a>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Document loaded');
            const modal = document.getElementById('successModal');
            const span = document.getElementsByClassName('close')[0];
            const homeButton = document.getElementById('homeButton');
            const loginButton = document.getElementById('loginButton');
            const modalMessage = document.getElementById('modalMessage');

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('Form submitted');
                const formData = new FormData(e.target);
                const data = {};
                formData.forEach((value, key) => {
                    data[key] = value;
                });

                try {
                    const response = await fetch('/.netlify/functions/registerUser', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    console.log('Result:', result);

                    if (response.ok) {
                        modalMessage.textContent = 'Account creation successful!';
                        homeButton.style.display = 'block';
                        loginButton.style.display = 'none';
                        e.target.reset(); // Clear the form fields
                    } else if (response.status === 409) {
                        modalMessage.textContent = 'Account already exists!';
                        homeButton.style.display = 'none';
                        loginButton.style.display = 'block';
                    }
                    modal.style.display = 'block';
                } catch (error) {
                    console.error('Error:', error);
                }
            });

            span.onclick = function() {
                modal.style.display = 'none';
            }

            homeButton.onclick = function() {
                window.location.href = 'user-home.html';
            }

            loginButton.onclick = function() {
                window.location.href = 'login.html';
            }

            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
